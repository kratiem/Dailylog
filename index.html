<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Log</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <!--
    Google の「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」
    バナーは、script.google.com の Web アプリ URL をトップレベルで開いたときだけ付きます。
    このページ（GAS 以外でホストした静的 HTML）から iframe で読み込むとバナーは出ません。

    ホスト例: Cloudflare Pages / GitHub Pages / 任意の静的サーバ / Google サイトの埋め込み
    Code.gs 側は setXFrameOptionsMode(ALLOWALL) が必須（実装済み）。
  -->
  <iframe
    id="app"
    title="Daily Log"
    src="about:blank"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <script>
    (function () {
      // 本番デプロイ URL（.clasp-deployment.json の deploymentId）
      var GAS_EXEC =
        'https://script.google.com/macros/s/AKfycbycxUjqVT5Hcv-f2JBOr4-GO_6cQM1seh05gUKKfjysAIBjSzqX2tsQMFV2S_KcmlDo/exec';
      // クエリをそのまま GAS に渡す（将来の ?date= 等用）
      document.getElementById('app').src = GAS_EXEC + window.location.search + window.location.hash;
    })();
  </script>
</body>
</html>
